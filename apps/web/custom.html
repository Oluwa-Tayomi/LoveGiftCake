<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Custom cake request — LoveGiftCake</title>
  <link rel="stylesheet" href="./tokens.css" />
  <style>
    body { font-family: var(--font-sans); background: var(--color-bg); color: var(--color-text); margin: 0; }
    .wrap { max-width: 720px; margin: 0 auto; padding: var(--space-4); }
    .card { background: var(--color-surface); border-radius: var(--radius-md); box-shadow: var(--shadow-card); padding: var(--space-4); margin-top: var(--space-4); }
    .muted { color: var(--color-muted); font-size: var(--text-sm); }
    label { display: block; margin-top: var(--space-3); font-size: var(--text-sm); }
    input, textarea { width: 100%; padding: 10px; border-radius: var(--radius-sm); border: 1px solid #e5d9cf; font-size: var(--text-base); }
    .btn { background: var(--color-primary); color: #fff; border: 0; border-radius: var(--radius-md); padding: 12px 18px; font-size: var(--text-base); margin-top: var(--space-4); width: 100%; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Request a custom cake</h1>
    <p class="muted">Describe it — we send it to up to 5 suitable vendors. Free to request, pay only when you accept a quote.</p>
    <div class="card">
      <label>Description <textarea id="desc" rows="4" placeholder="3-tier wedding cake, gold + white, serves 80…"></textarea></label>
      <label>Budget (NGN) <input id="budget" type="number" placeholder="e.g. 50000" /></label>
      <label>Needed on <input id="date" type="date" /></label>
      <label>City <input id="city" value="Jos" /></label>
      <button class="btn" onclick="send()">Send request</button>
      <p class="muted" id="status">Demo mode — connect config.js to send for real.</p>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./config.js" onerror="console.log('demo')"></script>
  <script>
    async function send() {
      const url = window.SUPABASE_URL, key = window.SUPABASE_ANON_KEY;
      if (!url || !key || url.includes("PASTE")) { document.getElementById("status").textContent = "Demo only — add config.js first."; return; }
      try {
        const db = supabase.createClient(url, key);
        const res = await db.from("custom_requests").insert({
          description: document.getElementById("desc").value,
          budget: +document.getElementById("budget").value || null,
          currency: "NGN", requested_date: document.getElementById("date").value || null,
          city: document.getElementById("city").value, country: "Nigeria", status: "open"
        }).select("id").single();
        if (res.error) throw res.error;
        document.getElementById("status").textContent = "Request sent: " + res.data.id + ". Vendors have 48h to quote.";
      } catch (e) { document.getElementById("status").textContent = "Failed: " + e.message; }
    }
  </script>
</body>
</html>
