<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign in — LoveGiftCake</title>
  <link rel="stylesheet" href="./tokens.css" />
  <link rel="stylesheet" href="./responsive.css" />
  <style>
    body { font-family: var(--font-sans); background: var(--color-bg); color: var(--color-text); margin: 0; }
    .wrap { max-width: 720px; margin: 0 auto; padding: var(--space-4); }
    .card { background: var(--color-surface); border-radius: var(--radius-md); box-shadow: var(--shadow-card); padding: var(--space-4); margin-top: var(--space-4); }
    .muted { color: var(--color-muted); font-size: var(--text-sm); }
    label { display: block; margin-top: var(--space-3); font-size: var(--text-sm); }
    input { width: 100%; padding: 10px; border-radius: var(--radius-sm); border: 1px solid #e5d9cf; font-size: var(--text-base); }
    .btn { background: var(--color-primary); color: #fff; border: 0; border-radius: var(--radius-md); padding: 12px 18px; font-size: var(--text-base); margin-top: var(--space-4); width: 100%; }
    .tabs { display: flex; gap: var(--space-2); }
    .tabs button { flex: 1; padding: 10px; border-radius: var(--radius-sm); border: 1px solid #e5d9cf; background: var(--color-surface); }
    .tabs button.on { background: var(--color-primary); color: #fff; border-color: var(--color-primary); }
    .roles { display: flex; gap: var(--space-3); margin-top: var(--space-2); }
  </style>
</head>
<body>
  <div class="wrap">
    <h1 id="title">Create account</h1>
    <p class="muted">Customers order cakes. Vendors sell cakes. Admins are added by us in the database — nobody can self-register as admin.</p>
    <div class="card">
      <div class="tabs">
        <button id="tUp" class="on" onclick="mode('up')">Sign up</button>
        <button id="tIn" onclick="mode('in')">Sign in</button>
      </div>
      <div id="upFields">
        <label>Your name <input id="name" placeholder="e.g. Ada" /></label>
        <label>I am a…</label>
        <div class="roles">
          <label><input type="radio" name="role" value="customer" checked style="width:auto" /> Customer</label>
          <label><input type="radio" name="role" value="vendor" style="width:auto" /> Vendor</label>
        </div>
      </div>
      <label>Email <input id="email" type="email" placeholder="you@example.com" /></label>
      <label>Password <input id="pw" type="password" placeholder="8+ characters" /></label>
      <button class="btn" id="go" onclick="go()">Create account</button>
      <p class="muted" id="out"></p>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./config.js" onerror="console.log('demo')"></script>
  <script src="./auth.js"></script>
  <script src="./nav.js" defer></script>
  <script>
    let m = "up";
    if (new URLSearchParams(location.search).get("mode") === "out") {
      (async () => { try { if (!needKeys()) await signOut(); } finally { location.href = "./index.html"; } })();
    }
    function mode(x) {
      m = x;
      document.getElementById("tUp").className = x === "up" ? "on" : "";
      document.getElementById("tIn").className = x === "in" ? "on" : "";
      document.getElementById("title").textContent = x === "up" ? "Create account" : "Welcome back";
      document.getElementById("upFields").style.display = x === "up" ? "" : "none";
      document.getElementById("go").textContent = x === "up" ? "Create account" : "Sign in";
    }
    async function go() {
      const out = document.getElementById("out");
      if (needKeys()) { out.textContent = "Demo — add config.js first (see supabase/SETUP_FREE.md)."; return; }
      out.textContent = "Working…";
      const email = document.getElementById("email").value.trim();
      const pw = document.getElementById("pw").value;
      try {
        if (m === "up") {
          const role = document.querySelector('input[name="role"]:checked').value;
          await signUp({ name: document.getElementById("name").value.trim(), email, password: pw, role });
          out.textContent = "Account created — check your email to confirm, then sign in.";
          mode("in");
        } else {
          await signIn({ email, password: pw });
          location.href = "./index.html";
        }
      } catch (e) { out.textContent = "Failed: " + e.message; }
    }
  </script>
</body>
</html>
