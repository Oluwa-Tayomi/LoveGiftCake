<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LoveGiftCake — Send a celebration, wherever they are</title>
  <link rel="stylesheet" href="./tokens.css" />
  <style>
    body { font-family: var(--font-sans); background: var(--color-bg); color: var(--color-text); margin: 0; }
    .wrap { max-width: 720px; margin: 0 auto; padding: var(--space-4); }
    .hero { background: var(--color-surface); border-radius: var(--radius-lg); box-shadow: var(--shadow-card); padding: var(--space-6); }
    .btn { background: var(--color-primary); color: #fff; border: 0; border-radius: var(--radius-md); padding: 12px 18px; font-size: var(--text-base); }
    .card { background: var(--color-surface); border-radius: var(--radius-md); box-shadow: var(--shadow-card); padding: var(--space-4); margin-top: var(--space-4); }
    .muted { color: var(--color-muted); font-size: var(--text-sm); }
    .steps { display: flex; gap: var(--space-2); flex-wrap: wrap; margin-top: var(--space-3); }
    .step { font-size: var(--text-xs); background: #fbeef1; border-radius: 999px; padding: 6px 10px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="hero">
      <h1 style="font-size:var(--text-2xl);margin:0">Send a celebration, wherever they are.</h1>
      <p class="muted">UK customer → verified baker in Jos → delivered to your person in Jos.</p>
      <button class="btn">Find cakes in Jos</button>
      <div class="steps">
        <span class="step">placed</span><span class="step">accepted</span>
        <span class="step">preparing</span><span class="step">ready</span>
        <span class="step">delivered</span>
      </div>
    </div>
    <div class="card">
      <strong>Sunshine Bakery — Jos</strong>
      <p class="muted">Verified • 4.8 rating • Delivery + pickup</p>
      <p>Chocolate birthday cake — ₦18,000 base + options shown clearly at checkout.</p>
    </div>
  </div>
</body>
</html>
